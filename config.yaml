# Swatch Match settings. Change values here, not in the code.

paths:
  catalogue_dir: catalogue        # design photos + stock.csv live here
  stock_csv: catalogue/stock.csv
  data_dir: data                  # SQLite DB, uploads and model cache (git-ignored)
  db_file: data/swatch.db

embeddings:
  model: clip-ViT-B-32            # sentence-transformers CLIP model (image + text in one space)

llm:
  provider: gemini                # "gemini" or "none" (forces fallback mode)
  model: gemini-3.5-flash-lite    # change here if Google renames models (bigger flash models were overloaded)
  timeout_seconds: 10             # Gemini's minimum; normal calls take 1-3 s, so fail fast if it is overloaded
  seconds_between_calls: 4      # free tier allows ~15 calls/minute
  compose_replies: true           # the AI writes each chat reply (checked against stock.csv); false = templates only

uploads:
  max_mb: 10                      # reject bigger files
  max_side_px: 1024               # downscale big photos before processing
  allowed_types: [image/jpeg, image/png, image/webp]
  max_text_chars: 1000            # longest enquiry text we accept

# Final score = weighted mix of three signals, each between 0 and 1.
# Weights depend on what the buyer sent.
scoring:
  weights:
    image_only:  {image: 1.0, attributes: 0.0, text: 0.0}
    text_only:   {image: 0.0, attributes: 0.6, text: 0.4}
    image_and_text: {image: 0.5, attributes: 0.4, text: 0.1}
  # Raw CLIP similarities sit in narrow bands, so they are stretched to 0-1:
  # at or below the first number -> 0, at or above the second -> 1.
  # Photo score = CLIP similarity + colour_weight x colour overlap (0-1).
  # Measured on the sample catalogue: unrelated photos ~0.70, look-alikes
  # ~0.80-0.89, same design re-photographed ~0.85-1.02; text vs photo ~0.20-0.35.
  colour_weight: 0.15
  image_range: [0.62, 0.90]
  text_range: [0.20, 0.34]
  # Over-budget designs are dropped; this many candidates get a stock check.
  candidates: 20
  # Photo + text: only the designs that look most like the photo are
  # considered, then the words re-rank them ("this design but in blue").
  image_pool: 10
  # Labels shown on each result card. Checked with evaluate.py on the sample
  # data: right first results score median 0.87, wrong ones at most 0.69.
  thresholds:
    very_close: 0.80
    similar: 0.65
    alternative: 0.50             # below this = "No match in stock"
  top_k: 5

# Fixed attribute vocabulary. Tags, parsing and filtering all use these values.
attributes:
  garment_type: [saree, dupatta, lehenga, dress material, fabric, blouse piece, kurti, other]
  main_colour: &colours [red, maroon, pink, orange, yellow, gold, green, blue, navy, purple, white, cream, black, grey, brown, silver, multicolour]
  secondary_colour: [none, red, maroon, pink, orange, yellow, gold, green, blue, navy, purple, white, cream, black, grey, brown, silver, multicolour]
  pattern: [plain, bandhani, leheriya, floral, paisley, geometric, checks, stripes, polka dots, ikat, patola, block print, abstract, other]
  border: [none, zari, contrast, temple, embroidered, printed, lace, other]
  fabric: [silk, cotton, georgette, chiffon, crepe, net, organza, linen, rayon, polyester, unknown]
  work_type: [none, zari weave, embroidery, print, mirror work, sequins, stone work, hand painted, other]

# Catalogue search. Exact search with one matrix multiply; only the closest
# top_n designs go on to scoring. Measured on a laptop: 4.5 ms at 60k designs,
# 16 ms at 200k, 95 ms at 1M (2 GB of vectors), always exact. An HNSW index
# took 19-78 s to build and was less accurate, so it is only worth it for
# multi-million catalogues.
search:
  top_n: 500
  large_catalogue: 2000000  # above this, use faiss HNSW if installed (requirements-large.txt)

# WhatsApp Business Cloud API. Keys go in .env, not here.
whatsapp:
  api_version: v23.0              # Meta Graph API version; update when Meta retires it
  merge_seconds: 120              # photo and text from the same buyer this close together = one enquiry
  max_photos: 5                   # design photos sent with a reply
  reply_window_hours: 24          # WhatsApp only allows free replies this long after the buyer's last message

# Shop terms the chat bot may quote when a buyer asks (delivery, COD, returns...).
# SAMPLE VALUES for the demo: change them to your shop's real terms. Anything not
# covered here is left for staff to confirm.
shop:
  delivery:
    en: We deliver across India by courier or transport, usually in 4 to 7 days.
    hinglish: Hum poore India mein courier ya transport se bhejte hain, aam taur par 4 se 7 din mein.
    hi: हम पूरे भारत में कूरियर या ट्रांसपोर्ट से भेजते हैं, आम तौर पर 4 से 7 दिन में।
    gu: અમે આખા ભારતમાં કુરિયર કે ટ્રાન્સપોર્ટથી મોકલીએ છીએ, સામાન્ય રીતે 4 થી 7 દિવસમાં.
  payment:
    en: We take UPI or bank transfer, paid in full before dispatch. We don't do cash on delivery.
    hinglish: Payment UPI ya bank transfer se, dispatch se pehle poora. Cash on delivery nahi hota.
    hi: पेमेंट UPI या बैंक ट्रांसफ़र से, डिस्पैच से पहले पूरा। कैश ऑन डिलीवरी नहीं होती।
    gu: પેમેન્ટ UPI કે બેંક ટ્રાન્સફરથી, ડિસ્પેચ પહેલાં પૂરું. કેશ ઓન ડિલિવરી નથી.
  minimum_order:
    en: There is no minimum order. You can order even a single piece.
    hinglish: Koi minimum order nahi hai, ek piece bhi le sakte hain.
    hi: कोई मिनिमम ऑर्डर नहीं है, एक पीस भी ले सकते हैं।
    gu: કોઈ મિનિમમ ઓર્ડર નથી, એક પીસ પણ લઈ શકો છો.
  returns:
    en: We exchange a piece with a manufacturing defect if you tell us within 7 days of delivery.
    hinglish: Manufacturing defect ho toh delivery ke 7 din ke andar bataiye, hum badal denge.
    hi: मैन्युफ़ैक्चरिंग डिफ़ेक्ट हो तो डिलीवरी के 7 दिन के अंदर बताइए, हम बदल देंगे।
    gu: મેન્યુફેક્ચરિંગ ખામી હોય તો ડિલિવરીના 7 દિવસમાં જણાવો, અમે બદલી આપીશું.
  blouse_piece:
    en: Our sarees come with an unstitched blouse piece.
    hinglish: Hamari sarees ke saath unstitched blouse piece aata hai.
    hi: हमारी साड़ियों के साथ बिना सिला ब्लाउज़ पीस आता है।
    gu: અમારી સાડી સાથે સીવ્યા વગરનો બ્લાઉઝ પીસ આવે છે.
  samples:
    en: We can send a single piece as a sample at the normal rate before a bulk order.
    hinglish: Bulk order se pehle ek piece sample ke liye normal rate par bhej sakte hain.
    hi: बल्क ऑर्डर से पहले एक पीस सैंपल के लिए सामान्य रेट पर भेज सकते हैं।
    gu: બલ્ક ઓર્ડર પહેલાં એક પીસ સેમ્પલ તરીકે સામાન્ય રેટ પર મોકલી શકીએ.
