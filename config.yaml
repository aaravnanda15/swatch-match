# Swatch Match settings. Change values here, not in the code.

paths:
  catalogue_dir: catalogue        # design photos + stock.csv live here
  stock_csv: catalogue/stock.csv
  data_dir: data                  # SQLite DB, uploads and model cache (git-ignored)
  db_file: data/swatch.db

embeddings:
  model: clip-ViT-B-32            # sentence-transformers CLIP model (image + text in one space)

llm:
  provider: gemini                # "gemini" or "none" (forces fallback mode)
  model: gemini-3.5-flash-lite    # change here if Google renames models (bigger flash models were overloaded)
  timeout_seconds: 20
  seconds_between_calls: 4      # free tier allows ~15 calls/minute

uploads:
  max_mb: 10                      # reject bigger files
  max_side_px: 1024               # downscale big photos before processing
  allowed_types: [image/jpeg, image/png, image/webp]
  max_text_chars: 1000            # longest enquiry text we accept

# Final score = weighted mix of three signals, each between 0 and 1.
# Weights depend on what the buyer sent.
scoring:
  weights:
    image_only:  {image: 1.0, attributes: 0.0, text: 0.0}
    text_only:   {image: 0.0, attributes: 0.6, text: 0.4}
    image_and_text: {image: 0.5, attributes: 0.4, text: 0.1}
  # Raw CLIP similarities sit in narrow bands, so they are stretched to 0-1:
  # at or below the first number -> 0, at or above the second -> 1.
  # Measured on the sample catalogue: unrelated photos ~0.71, same design
  # re-photographed ~0.85-0.92; text vs photo only ~0.20-0.35.
  image_range: [0.65, 0.95]
  text_range: [0.20, 0.34]
  # Over-budget designs are dropped; this many candidates get a stock check.
  candidates: 20
  # Photo + text: only the designs that look most like the photo are
  # considered, then the words re-rank them ("this design but in blue").
  image_pool: 10
  # Labels shown on each result card. Checked with evaluate.py on the sample
  # data: right first results score median 0.87, wrong ones at most 0.69.
  thresholds:
    very_close: 0.80
    similar: 0.65
    alternative: 0.50             # below this = "No match in stock"
  top_k: 5

# Fixed attribute vocabulary. Tags, parsing and filtering all use these values.
attributes:
  garment_type: [saree, dupatta, lehenga, dress material, fabric, blouse piece, kurti, other]
  main_colour: &colours [red, maroon, pink, orange, yellow, gold, green, blue, navy, purple, white, cream, black, grey, brown, silver, multicolour]
  secondary_colour: [none, red, maroon, pink, orange, yellow, gold, green, blue, navy, purple, white, cream, black, grey, brown, silver, multicolour]
  pattern: [plain, bandhani, leheriya, floral, paisley, geometric, checks, stripes, polka dots, ikat, patola, block print, abstract, other]
  border: [none, zari, contrast, temple, embroidered, printed, lace, other]
  fabric: [silk, cotton, georgette, chiffon, crepe, net, organza, linen, rayon, polyester, unknown]
  work_type: [none, zari weave, embroidery, print, mirror work, sequins, stone work, hand painted, other]

# WhatsApp Business Cloud API. Keys go in .env, not here.
whatsapp:
  api_version: v23.0              # Meta Graph API version; update when Meta retires it
  merge_seconds: 120              # photo and text from the same buyer this close together = one enquiry
  max_photos: 5                   # design photos sent with a reply
  reply_window_hours: 24          # WhatsApp only allows free replies this long after the buyer's last message
